

# Blueprint de Render: crea el servicio web de la API a partir del Dockerfile
services:
  - type: web
    name: appVentasProducto
    runtime: docker
    plan: free
    region: virginia # misma zona que Supabase (us-east-1): consultas mucho mas rapidas
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false # cadena del Session pooler de Supabase (se pega en el panel de Render)
