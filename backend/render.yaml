services:

type: web
name: appVentasProducto
env: python
plan: free
region: oregon # Puedes usar frankfurt, ohio, oregon o singapore
rootDir: backend # Apunta a tu carpeta backend
buildCommand: pip install -r requirements.txt
startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
envVars:

key: PYTHON_VERSION
value: 3.11.9

key: DATABASE_URL
sync: false # Te pedirá el valor secreto en el dashboard de Render sin exponerlo en GitHub

